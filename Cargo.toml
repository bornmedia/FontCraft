[package]
name = "fontcraft"
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "FontCraft - a free font manager: organise, preview and activate fonts without installing them."

[dependencies]
# No built-in fonts: FontCraft ships without a single font file and uses the
# computer's own interface font (see src/uifont.rs).
eframe = { version = "0.31", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
winit = "0.30"
egui = { version = "0.31", default-features = false }
ab_glyph = "0.2"
ttf-parser = "0.25"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
# reading pictures from the clipboard for the Font finder
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
flate2 = "1"
# unpacking the family downloads of Fontshare and Font Squirrel
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
# turning assets/icon.png into the Windows program icon (FontCraft.exe in Explorer and the taskbar)
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # where Windows keeps the person's Downloads folder (it can be moved)
    "Win32_UI_Shell",
    "Win32_System_Com",
    # telling network drives (mapped letters) from local ones
    "Win32_Storage_FileSystem",
    # listing active fonts in the user's font list, so "Package" in Illustrator/InDesign finds their files
    "Win32_System_Registry",
    # the key names of the keyboard in use for the shortcut list ("Strg", "Umschalt"…)
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
